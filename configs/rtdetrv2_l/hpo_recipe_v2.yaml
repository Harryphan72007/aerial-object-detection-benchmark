schema_version: 2
protocol_id: rtdetr_optuna_v2
sampler: random
seed: 42
phase_trials: 5
objective:
  primary: mAP50-95
  secondary_tiebreak: APtiny
  directions: [maximize, maximize]
search_space:
  detector_learning_rate:
    kind: float
    low: 0.00003
    high: 0.0002
    log: true
  backbone_lr_multiplier:
    kind: categorical
    choices: [0.05, 0.1, 0.2]
  weight_decay:
    kind: categorical
    choices: [0.00005, 0.0001, 0.0002]
  warmup_steps:
    kind: categorical
    choices: [500, 1000, 2000]
  gradient_clip_norm:
    kind: categorical
    choices: [0.1, 0.5]
