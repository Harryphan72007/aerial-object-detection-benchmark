schema_version: 1
benchmark_track: controlled
output_namespace: controlled
comparison_table: controlled_summary
model_ids:
  - faster_rcnn_resnet50
  - faster_rcnn_swin_t
  - faster_rcnn_vmamba_t
  - rtdetrv2_l
allowed_options:
  - input_resolution
  - batch_size
  - gradient_accumulation_steps
  - use_amp
defaults:
  input_resolution: 640
  batch_size: 1
  gradient_accumulation_steps: 8
  use_amp: true
# Single source of truth for the controlled two-stage HPO protocol. The HPO
# search workflow and the final-training workflow read every resolution / batch /
# accumulation / epoch / seed value from here; no protocol constant is hardcoded
# in src/hpo/. Per-model configs may only differ by learning_rate.
protocol:
  protocol_id: two_stage_random_hpo_v1
  image_size: 640
  batch_size: 1
  gradient_accumulation_steps: 8
  effective_batch_size: 8
  use_amp: true
  search_seed: 42
  phase_trials: 5
  phase_a_epochs: 3
  phase_b_epochs: 3
  final_train_epochs: 8
  # Headline run matrix (default): one tuned recipe at one seed per model, on the
  # 2class track only. This is what actually fits ~one model per GPU-day. A
  # default-LR "baseline" is a second, worse LR, not a scientific control, so it
  # is not part of the headline matrix. Differences below seed noise
  # (~0.3-0.8 mAP on VisDrone) must not be claimed from a single-seed table.
  final_recipes: [tuned]
  final_seeds: [42]
  # Explicit opt-in override (run with full_matrix=True): the default-LR baseline
  # diagnostic plus multi-seed validation. Report separately, before publishing
  # conclusions, as the variance estimate the single-seed headline lacks.
  full_matrix_recipes: [baseline, tuned]
  full_matrix_seeds: [17, 42, 3407]
  # No per-model epoch deviations. The controlled track gives every architecture
  # an identical epoch budget; a differing budget would be exactly the confound
  # this track exists to eliminate. Any model-specific schedule length belongs in
  # the performance track, documented and justified, not here.
