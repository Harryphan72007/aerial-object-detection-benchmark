[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visdrone-architecture-benchmark"
version = "0.1.0"
description = "Reproducible CNN, Transformer, Mamba, and RT-DETR benchmark for VisDrone"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6", "numpy>=1.24", "pandas>=2", "Pillow>=10", "psutil>=5.9", "filelock>=3.13"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
