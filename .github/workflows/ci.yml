name: ci
on:
  push:
  pull_request:
jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . pytest ruff pyyaml numpy pandas pillow psutil
      - run: ruff check src scripts tests
      - run: pytest -q
