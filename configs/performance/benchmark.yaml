schema_version: 1
benchmark_track: performance
output_namespace: performance
comparison_table: performance_summary
model_ids:
  - faster_rcnn_resnet50
  - faster_rcnn_swin_t
  - faster_rcnn_vmamba_t
  - rtdetrv2_l
allowed_options:
  - input_resolution
  - batch_size
  - gradient_accumulation_steps
  - use_amp
  - ema_enabled
  - tiled_training
  - sliced_inference
  - label_granularity
defaults:
  input_resolution: 1024
  batch_size: 1
  gradient_accumulation_steps: 8
  use_amp: true
  ema_enabled: true
  tiled_training: false
  sliced_inference: false
  label_granularity: direct_2class
