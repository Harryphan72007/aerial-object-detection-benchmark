dataset:
  name: VisDrone2019-DET
  train_split: data/raw/VisDrone2019-DET-train
  val_split: data/raw/VisDrone2019-DET-val
  image_size: 640
protocol:
  epochs: 50
  seeds: [17, 42, 73]
  precision: fp32
  gradient_accumulation: 1
  early_stopping: false
  augmentations:
    horizontal_flip: 0.5
    color_jitter: 0.2
    random_crop: false
evaluation:
  metrics: [map, map_50, map_75, map_small, map_medium, map_large]
  latency_warmup_steps: 50
  latency_measure_steps: 200
  batch_sizes: [1, 8]
optimization:
  trials: 30
  sampler_seed: 2026
  direction: maximize
