name: static

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e . ruff
      - run: ruff check src scripts tests
      - run: python -m compileall -q src scripts tests
      - run: python scripts/validation/validate_ci_contract.py
