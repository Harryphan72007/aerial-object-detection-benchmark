name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security-and-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validation/check_prohibited_files.py --repo-root .
      - run: python scripts/scan_repository_secrets.py
      - run: python -m pip install -e .
      - run: python -m scripts.validate_results --repo-results results/
