schema_version: 2
protocol_id: rtdetr_optuna_v2
sampler: random
seed: 42
phase_trials: 5
objective:
  primary: mAP50-95
  secondary_tiebreak: APtiny
  directions: [maximize, maximize]
search_space:
  detector_learning_rate:
    kind: float
    low: 0.000001
    high: 0.0005
    log: true
  backbone_lr_multiplier:
    kind: categorical
    choices: [0.05, 0.1, 0.2]
  weight_decay:
    kind: float
    low: 0.01
    high: 0.1
    log: true
  warmup_epochs:
    kind: categorical
    choices: [1, 2, 3]
  gradient_clip_norm:
    kind: categorical
    choices: [0.05, 0.1, 0.2]
