name: notebooks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  notebook-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e . -r requirements-notebook-test.txt
      - run: python scripts/validate_notebooks.py
      - run: python scripts/clean_notebooks.py --check notebooks
      - run: python scripts/run_notebook_smoke.py --timeout 180
      - run: python scripts/validation/inventory_legacy_artifacts.py --repo-root . --check schemas/legacy/notebook_artifact_inventory_v1.json
